<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&nbsp;</title>
<style>
  :root { --gap: 6px; --row: 260px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #111; }
  #wall {
    padding: var(--gap);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .row { display: flex; gap: var(--gap); }
  .tile {
    display: block;
    position: relative;
    overflow: hidden;
    background: #1b1b1b;
    flex: 0 0 auto;
  }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #tally {
    height: 34px;
    line-height: 34px;
    text-align: center;
    font: 11px/34px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    letter-spacing: .06em;
    color: #2f2f2f;
    -webkit-user-select: none; user-select: none;
    transition: color .35s ease;
  }
  #tally:hover { color: #6a6a6a; }
  @media (max-width: 640px) { :root { --row: 170px; } }
</style>
</head>
<body>
<div id="wall" data-ref="wall"></div>
<div id="tally" data-ref="tally"></div>

<script>
(function () {
  const wall = document.getElementById("wall");
  let measured = [];
  let lastKey = "";      // JSON signature of the items currently displayed

  // --- fetch the data file fresh (bypasses browser cache) ---
  async function fetchItems() {
    const res = await fetch("images.js?t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    const scope = {};
    // images.js does: window.NEWS_ITEMS = [...]  — run it against a scratch object
    new Function("window", text)(scope);
    return scope.NEWS_ITEMS || [];
  }

  function measure(item) {
    return new Promise((resolve) => {
      const im = new Image();
      im.onload  = () => resolve({ ...item, ar: im.naturalWidth / im.naturalHeight });
      im.onerror = () => resolve({ ...item, ar: 1 });
      im.src = item.src;
    });
  }

  // --- justified-rows layout: newest top-left, reading order, fill width ---
  function layout(items) {
    const cs = getComputedStyle(document.documentElement);
    const gap = parseInt(cs.getPropertyValue("--gap")) || 6;
    const targetH = parseInt(cs.getPropertyValue("--row")) || 260;
    const containerW = wall.clientWidth - gap * 2;

    wall.innerHTML = "";
    let row = [], arSum = 0;

    function flush(isLast) {
      if (!row.length) return;
      const gaps = gap * (row.length - 1);
      const naturalW = arSum * targetH;
      let h = targetH;
      if (!isLast || naturalW + gaps >= containerW) h = (containerW - gaps) / arSum;
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      row.forEach((it) => {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = it.href || "#";
        a.target = "_blank";
        a.rel = "noopener";
        a.style.width = (it.ar * h) + "px";
        a.style.height = h + "px";
        const img = document.createElement("img");
        img.src = it.src; img.loading = "lazy"; img.alt = "";
        a.appendChild(img);
        rowEl.appendChild(a);
      });
      wall.appendChild(rowEl);
      row = []; arSum = 0;
    }

    items.forEach((it) => {
      row.push(it); arSum += it.ar;
      const gaps = gap * (row.length - 1);
      if (arSum * targetH + gaps >= containerW) flush(false);
    });
    flush(true);
  }

  // --- refresh: re-fetch, and only remeasure/relayout if the set changed ---
  async function refresh() {
    try {
      const items = await fetchItems();
      const key = JSON.stringify(items.map((i) => i.src + "|" + i.href));
      if (key === lastKey) return;         // nothing new — leave it alone
      lastKey = key;
      measured = await Promise.all(items.map(measure));
      layout(measured);
    } catch (e) { /* offline / transient — try again next tick */ }
  }

  refresh();
  setInterval(refresh, 30000);                       // auto-check every 30s
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refresh();                  // and whenever you return to the tab
  });

  let t;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(() => { if (measured.length) layout(measured); }, 120);
  });
})();
</script>
<script>
/* --- visit tally -------------------------------------------------------
   Static site, so the counts live on Abacus (abacus.jasoncameron.dev),
   a free no-signup counter API. Two counters in namespace "maximg-org":
     visits  = total pageviews   uniques = distinct browsers
   Counted ONCE per browser session (sessionStorage), so the wall's 30s
   auto-refresh and plain reloads never inflate it. "uniques" is gated on
   a localStorage flag so a given browser only ever adds 1.
   Any failure (service down, ad blocker) leaves the footer blank.
--------------------------------------------------------------------- */
(function () {
  var API = "https://abacus.jasoncameron.dev";
  var NS  = "maximg-org";
  var el  = document.getElementById("tally");
  if (!el) return;

  function store(kind) {                 // storage can throw in some privacy modes
    try { return kind === "s" ? window.sessionStorage : window.localStorage; }
    catch (e) { return null; }
  }
  function flag(s, k) { try { return s && s.getItem(k); } catch (e) { return null; } }
  function mark(s, k) { try { s && s.setItem(k, "1"); } catch (e) {} }

  // counted already this session/browser? then just read, don't increment
  function ask(key, alreadyCounted) {
    var verb = alreadyCounted ? "get" : "hit";
    return fetch(API + "/" + verb + "/" + NS + "/" + key, { mode: "cors", cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return j && typeof j.value === "number" ? j.value : null; })
      .catch(function () { return null; });
  }

  var ss = store("s"), ls = store("l");
  var seenSession = !!flag(ss, "nw_session");
  var seenEver    = !!flag(ls, "nw_visitor");

  Promise.all([
    ask("visits",  seenSession),
    ask("uniques", seenEver || seenSession)
  ]).then(function (res) {
    if (!seenSession) mark(ss, "nw_session");
    if (!seenEver)    mark(ls, "nw_visitor");

    var visits = res[0], uniques = res[1];
    if (visits === null && uniques === null) return;   // stay silent, no error text

    var bits = [];
    if (visits !== null)  bits.push(visits.toLocaleString()  + (visits  === 1 ? " visit"   : " visits"));
    if (uniques !== null) bits.push(uniques.toLocaleString() + (uniques === 1 ? " visitor" : " visitors"));
    bits.push("since 18 Aug 2026");
    el.textContent = bits.join("  \u00b7  ");
  });
})();
</script>
</body>
</html>
